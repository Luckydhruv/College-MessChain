version: '3.8'
services:
  besu:
    image: hyperledger/besu:latest
    network_mode: host
    volumes:
      - ./besu:/config
      - ${DATA_DIR}/besu-data:/data
    command: >
      --config-file=/config/config.toml
      --data-path=/data

  postgres:
    image: postgres:15
    network_mode: host
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: mess_secret
      POSTGRES_DB: mess_auth
    volumes:
      - ${DATA_DIR}/pg-data:/var/lib/postgresql/data

  ipfs:
    image: ipfs/kubo:latest
    network_mode: host
    volumes:
      - ${DATA_DIR}/ipfs-data:/data/ipfs